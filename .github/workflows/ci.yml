name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
# Saves CI minutes on force-pushes and rapid iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: npm audit (non-blocking)
        # Non-blocking initially so existing transitive vulnerabilities don't
        # immediately red the build. Tighten to blocking once the backlog is
        # triaged (drop continue-on-error).
        continue-on-error: true
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Next.js build
        # Stub env values that satisfy @t3-oss/env-nextjs validation. `next build`
        # for App Router routes does not need a live DB at build time — these
        # values are placeholders to pass schema validation only.
        env:
          DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub"
          NEXTAUTH_SECRET: "stub-secret-for-build-time-validation-only-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
          JWT_ACCESS_SECRET: "stub-jwt-access-secret-for-build-validation-32ch"
          JWT_REFRESH_SECRET: "stub-jwt-refresh-secret-for-build-validation-32c"
          ADMIN_TOKEN: "stub-admin-token-for-build-time-validation-64chars-need-this-many"
          EMAIL_FROM: "stub@example.com"
          EMAIL_DELIVERY_MODE: "console"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - run: npm run test:e2e
